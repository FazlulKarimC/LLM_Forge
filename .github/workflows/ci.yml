name: CI Regression Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './sdk/python[test]'
      - run: python -m pytest sdk/python/tests -q
      - run: python -m pip wheel --no-deps ./sdk/python -w dist
      - name: Check installed SDK wheel
        run: |
          python -m venv /tmp/llmforge-wheel-check
          /tmp/llmforge-wheel-check/bin/pip install dist/llmforge_sdk-*.whl
          /tmp/llmforge-wheel-check/bin/python -m llmforge --help

  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: llmforge
          POSTGRES_PASSWORD: llmforge_password
          POSTGRES_DB: llmforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: |
          backend/requirements.txt
          backend/constraints.txt
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt
        pip install pytest pytest-asyncio aiosqlite
        pip install -e ../sdk/python
        
    - name: Apply database migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://llmforge:llmforge_password@localhost:5432/llmforge_test
        INFERENCE_ENGINE: mock
      run: python -m alembic upgrade head

    - name: Run Pytest Suite
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://llmforge:llmforge_password@localhost:5432/llmforge_test
        INFERENCE_ENGINE: mock
        DEMO_MODE: true
      run: |
        pytest -v tests/

    - name: Smoke test SDK and CI gate against PostgreSQL
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://llmforge:llmforge_password@localhost:5432/llmforge_test
        INFERENCE_ENGINE: mock
        DEMO_MODE: true
      run: |
        uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        server_pid=$!
        trap 'kill $server_pid' EXIT
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then break; fi
          sleep 1
        done
        curl --fail --silent http://127.0.0.1:8000/health > /dev/null
        python -m scripts.smoke_sdk

  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Type Check
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Frontend Tests
      working-directory: ./frontend
      run: npm test
        
    - name: Build Next.js app
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      run: npm run build

  sync-to-hub:
    if: github.event_name == 'push'
    needs: [python-sdk, backend-test, frontend-build]
    uses: ./.github/workflows/hf-sync.yml
    secrets: inherit
